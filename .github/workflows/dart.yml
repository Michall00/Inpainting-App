name: iOS-ipa-build

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: flutter pub get

      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash

      - name: Generate firebase_app_id_file.json
        run: |
          cat > ios/firebase_app_id_file.json <<EOF
          {
            "app_id": "${{ secrets.FIREBASE_APP_ID }}",
            "api_key": "${{ secrets.FIREBASE_API_KEY }}",
            "project_id": "${{ secrets.FIREBASE_PROJECT_ID }}"
          }
          EOF

      - name: Decode GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Generate firebase_options.dart
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          flutterfire configure --project=${{ secrets.FIREBASE_PROJECT_ID }} --platforms=ios --out=lib/firebase_options.dart --yes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}  

      - name: Ensure Podfile with iOS 13.0
        run: |
          cd ios
          if [ ! -f Podfile ]; then
            pod init
          fi
          if grep -q "^platform :ios" Podfile; then
            sed -i '' 's/^platform :ios.*/platform :ios, '\''13.0'\''/' Podfile
          else
            sed -i '' '1s;^;platform :ios, '\''13.0'\''\n;' Podfile
          fi
          
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Patch Xcode project
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PBX"

          # 1) TargetAttributes (Runner)
          awk '1;/TargetAttributes = \{/{flag=1}
              flag && /97C146ED1CF9000F007C117D/ { print; print "\t\t\t\tDevelopmentTeam = AAAAAAAAAA;"; flag=0; next }' "$PBX" > "$PBX.tmp" && mv "$PBX.tmp" "$PBX"

          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = AAAAAAAAAA;/g' "$PBX"
          grep -q 'DEVELOPMENT_TEAM = AAAAAAAAAA;' "$PBX" || \
            sed -i '' 's/PRODUCT_NAME = "\$([^)]*)";/&\
            \t\t\t\tDEVELOPMENT_TEAM = AAAAAAAAAA;\
            \t\t\t\tCODE_SIGN_STYLE = Manual;\
            \t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";\
            \t\t\t\tCODE_SIGN_IDENTITY = "";\
            \t\t\t\t"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "";/g' "$PBX"

          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBX"

          echo "---- sanity check ----"
          grep -n 'DevelopmentTeam = ' "$PBX" || true
          grep -n 'DEVELOPMENT_TEAM = ' "$PBX" || true



      - name: Build iOS app
        run: flutter build ipa --release --no-codesign --build-name=1.1.0 --build-number=${{ github.run_number }}

      - name: Check UUIDs
        run: |
          APP_UUID=$(dwarfdump --uuid build/ios/iphoneos/Runner.app/Runner | grep '(arm64)' | grep -o 'UUID: [0-9A-F-]*' | cut -d' ' -f2)
          DSYM_UUID=$(dwarfdump --uuid build/ios/Release-iphoneos/Runner.app.dSYM | grep '(arm64)' | grep -o 'UUID: [0-9A-F-]*' | cut -d' ' -f2)
          if [ "$APP_UUID" = "$DSYM_UUID" ]; then
            echo "UUIDs match: $APP_UUID"
          else
            echo "UUIDs do not match: APP_UUID=$APP_UUID, DSYM_UUID=$DSYM_UUID"
            exit 1
          fi

      - name: Upload dSYM to Crashlytics
        run: |
          dsymPath="build/ios/Release-iphoneos/Runner.app.dSYM"
          if [[ ! -d ${dsymPath} ]]; then
            echo "No debug symbols were found, skip publishing to Firebase Crashlytics"
          else
            echo "Publishing debug symbols from $dsymPath to Firebase Crashlytics"
            ./ios/Pods/FirebaseCrashlytics/upload-symbols -gsp ios/Runner/GoogleService-Info.plist -p ios $dsymPath
          fi

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v${{ github.run_number }}
          overwrite: true
          body: "This is first release"